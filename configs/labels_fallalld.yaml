# configs/labels_fallalld.yaml
#
# Ánh xạ activity_id -> lớp mục tiêu (5 lớp: 0-Đứng, 1-Ngồi, 2-Đi bộ, 3-Chạy, 4-Té ngã)
# QUY TẮC: Điền target_class (0-4) hoặc null để bỏ qua bản ghi đó.
# Script sẽ cảnh báo và bỏ qua activity còn target_class: null khi chạy 02_build_windows.py.
#
# Nguồn tham khảo: FallAllD paper Table 1 (Saleh et al., Sensors 2021)
# ADL:  activity_id 1–44  (is_fall = false)
# Fall: activity_id 101–135 (is_fall = true, activity_id >= 100)
#
# Mapping đã xác nhận cho milestone tuần 8:
#   Standing: 14, 41
#   Sitting: 13, 42
#   Walking: 19–22, 29–36
#   Running: 24, 25, 43, 44
#   Fall: 101–135
# Các activity còn lại được giữ null và loại khỏi windows.

activity_map:
